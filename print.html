<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imprimir diploma · La Carrera más Linda 2026</title>
<style>
  @page { size: A4 landscape; margin: 6mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: #f4e9f1; color: #2b1026;
    display: flex; flex-direction: column; align-items: center;
    padding: 1rem;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center;
    margin-bottom: 1rem;
  }
  .toolbar p { margin: 0 .5rem; font-size: .88rem; color: #6b4a63; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border-radius: 999px; padding: .6rem 1.1rem; border: 1px solid #f0d7e4;
    background: #fff; color: #b4126b;
  }
  button.primary { background: #b4126b; border-color: #b4126b; color: #fff; }
  .sheet {
    width: min(100%, 1500px);
    background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(109, 11, 70, .18);
  }
  .sheet img { display: block; width: 100%; height: auto; }
  .missing { background: #fff; border: 1px solid #f0d7e4; border-radius: 14px; padding: 2rem; text-align: center; max-width: 30rem; }
  .missing h1 { font-size: 1.2rem; margin: 0 0 .4rem; color: #6d0b46; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none !important; }
    .sheet { box-shadow: none; border-radius: 0; width: 100%; }
    .sheet img { width: 100%; height: auto; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <button class="primary" id="printBtn" type="button">Imprimir diploma</button>
  <p id="hint">Selecciona tu impresora o "Guardar como PDF".</p>
  <button id="closeBtn" type="button">Cerrar</button>
</div>

<figure class="sheet" id="sheet" hidden style="margin:0">
  <img id="img" alt="">
</figure>

<div class="missing" id="missing" hidden>
  <h1>Diploma no disponible</h1>
  <p id="missingText">No encontramos el diploma solicitado.</p>
</div>

<script src="data.js"></script>
<script>
(function () {
  var data = window.EVENT_DATA || { athletes: [] };
  var params = new URLSearchParams(location.search);
  var dorsal = params.get('dorsal');
  var a = (data.athletes || []).filter(function (x) { return String(x.dorsal) === String(dorsal); })[0];
  var img = document.getElementById('img');
  var sheet = document.getElementById('sheet');
  var missing = document.getElementById('missing');
  var printBtn = document.getElementById('printBtn');
  var closeBtn = document.getElementById('closeBtn');

  document.title = a ? 'Diploma de ' + a.name : 'Diploma no encontrado';

  function showMissing(msg) {
    document.getElementById('toolbar').hidden = true;
    missing.hidden = false;
    document.getElementById('missingText').textContent = msg;
  }

  if (!a || !a.diplomaImg) {
    showMissing('No encontramos un diploma para el dorsal ' + (dorsal || 'indicado') + '.');
    return;
  }

  img.alt = 'Diploma de participación de ' + a.name;
  img.onload = function () {
    sheet.hidden = false;
    window.setTimeout(function () { window.print(); }, 450);
  };
  img.onerror = function () { showMissing('No se pudo cargar la imagen del diploma.'); };
  img.src = a.diplomaImg;

  printBtn.addEventListener('click', function () { window.print(); });
  closeBtn.addEventListener('click', function () { window.close(); });
})();
</script>
</body>
</html>
